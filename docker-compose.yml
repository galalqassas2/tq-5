services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: queue
      POSTGRES_DB: queue
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "queue"]
      interval: 1s
      timeout: 3s
      retries: 30
